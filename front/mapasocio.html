<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa - Trencito Puerto Azul</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/leaflet.css">
    
    <link rel="stylesheet" href="css/stylemapa.css">
</head>
<body>

    <div class="app-screen">

        <div class="map-area" id="map"></div>

        <div class="top-info-bar">
            <div class="info-card">
                <span class="info-label">Puestos Libres:</span>
                <span class="info-value value-blue" id="seatsCounter">9</span>
            </div>
        </div>

        <button class="btn-status-circle" onclick="openStatusModal()" title="Consultar disponibilidad">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        </button>

        <div class="modal-overlay" id="statusModal" style="display: none;">
            <div class="modal-card">
                <div class="status-icon-container">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0044cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <h3>Disponibilidad del Servicio</h3>
                <p class="modal-description-status" id="statusModalMessage">
                    El trencito estará prestando su servicio...
                </p>
                <div class="modal-actions-horizontal">
                    <button class="btn-modal-confirm" onclick="toggleModal('statusModal', false)">Volver al mapa</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="stationModal" style="display: none;">
            <div class="modal-card" style="max-width: 420px; padding: 24px;">
                <h3 id="modalStationName" style="margin-bottom: 4px;">Nombre Estación</h3>

                <div class="station-actions-vertical" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;">
                    <button class="btn-station-action action-add" onclick="unirseAColaVirtual()">
                        ➕ Añadirse a la cola
                    </button>
                    <button class="btn-station-action action-remove" onclick="eliminarseDeColaVirtual()">
                        ➖ Eliminarse de la cola
                    </button>
                    <button class="btn-station-action action-time" onclick="showEstimatedTime()">
                        ⏱️ Ver tiempo estimado de llegada
                    </button>
                </div>
                
                <div class="modal-actions-horizontal">
                    <button class="btn-modal-cancel" style="border-radius: 24px; padding: 14px; width: 100%;" onclick="toggleModal('stationModal', false)">Salir</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="mensajeColaModal" style="display: none;">
            <div class="modal-card" style="max-width: 400px; padding: 24px; text-align: center;">
                <div class="status-icon-container" style="margin-bottom: 16px;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0044cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <h3>Cola Virtual</h3>
                <p class="modal-description-status" id="mensajeColaTexto" style="margin-top: 12px; margin-bottom: 24px; color: #4b5563; font-size: 15px; line-height: 1.5;">
                    </p>
                <div class="modal-actions-horizontal">
                    <button class="btn-modal-confirm" style="width: 100%;" onclick="presionarOKCola()">OK</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="cierreServicioModal" style="display: none; z-index: 9999;">
            <div class="modal-card" style="max-width: 400px; padding: 24px; text-align: center;">
                <div class="status-icon-container" style="margin-bottom: 16px;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <h3>Servicio No Disponible</h3>
                <p class="modal-description-status" id="mensajeCierreTexto" style="margin-top: 12px; margin-bottom: 24px; color: #4b5563; font-size: 15px; line-height: 1.5;">
                    </p>
                <div class="modal-actions-horizontal">
                    <button class="btn-modal-confirm" style="width: 100%; background-color: #dc2626;" onclick="redirigirAInicioSesion()">Confirmar</button>
                </div>
            </div>
        </div>

        <footer class="app-footer">
            <div class="footer-left">
                <img src="assets/puertoa-removebg-preview.png" alt="Logo Puerto Azul" class="footer-logo">
            </div>
            <div class="footer-center">
                &copy; 2026 Club Puerto Azul. Todos los derechos reservados.
            </div>
            <div class="footer-right">
                Desarrollado con <a href="https://leafletjs.com" target="_blank" rel="noopener noreferrer" class="footer-link">Leaflet</a>
            </div>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/services/mapa.js"></script>
</body>
</html>
