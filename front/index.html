<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Club Puerto Azul | Trencito - Inicio de Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styleinicsesion.css">
</head>
<body>

    <!-- HEADER con título principal "Trencito Puerto Azul" -->
    <header class="main-header">
        <div class="header-container">
            <div class="header-brand">
                <img class="iconoaclaro" src="assets/puertoa-removebg-preview.png" alt="Logo Puerto Azul">
                <h1 class="brand-title">Trencito Puerto Azul</h1>
            </div>
        </div>
    </header>

    <!-- MAIN: contenedor flex con tarjeta de inicio de sesión -->
    <main class="login-main">
        <div class="login-card">
            <!-- Título "Inicia sesión" -->
            <div class="login-headline">
                <h2>Inicia sesión</h2>
                <p>Accede a la ubicación del trencito en tiempo real</p>
            </div>

            <!-- Formulario: cédula + clave de acceso -->
            <form id="loginForm" class="login-form" action="javascript:void(0);" method="post" novalidate>
                <!-- Campo Cédula -->
                <div class="input-field">
                    <label>Cédula</label>
                    <input type="text" id="cedulaInput" name="cedula" placeholder="ejem: 31707565" autocomplete="off" value="">
                </div>

                <!-- Campo Clave de acceso -->
                <div class="input-field">
                    <label>Clave de acceso</label>
                    <input type="text" id="claveInput" name="clave" placeholder="ejem: 291-v324" autocomplete="off" value="">
                </div>

                <!-- Casilla para recordar sesión y link de ayuda -->
                <div class="form-extra">
                    <label class="checkbox-remember">
                        <input type="checkbox" id="rememberCheckbox"> Mantener sesión iniciada
                    </label>
                    <a href="#" id="helpAccessLink" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón de envío -->
                <button type="submit" class="btn-login" id="submitBtn">
                    <span> Ingresar al sistema </span>
                </button>
            </form>
        </div>
    </main>

    <!-- FOOTER con copyright -->
    <footer class="main-footer">
        <div class="footer-content">
            <div class="copyright-text">
                © 2026 <strong>Club Puerto Azul</strong>. Todos los derechos reservados.
            </div>
            <div class="footer-legal">
                Trencito Puerto Azul · Sistema oficial de seguimiento
            </div>
        </div>
    </footer>

    <!-- Toast de notificación -->
    <div id="liveToastMsg" class="custom-toast">Puerto Azul · Conectando al sistema</div>

    <script src="js/services/script.js"></script>
</body>
</html>
