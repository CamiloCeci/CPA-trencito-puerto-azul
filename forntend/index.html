<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Club TPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow" style="width: 24rem;">
            <h2 class="text-center mb-4">Iniciar Sesión 🔑</h2>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Cédula</label>
                    <input type="text" id="cedula" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="clave" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            
            <div id="mensajeError" class="text-danger mt-3 text-center" style="display:none;">
                Usuario o clave incorrectos
            </div>
        </div>
    </div>

    <script type="module" src="js/controllers/loginController.js"></script>
</body>
</html>
