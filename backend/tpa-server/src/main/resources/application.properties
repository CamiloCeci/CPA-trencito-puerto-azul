# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
# The port your Spring Boot backend will listen on (default is 8080)
server.port=8080

# ===================================================================
# DATABASE CONFIGURATION (File-Based H2)
# ===================================================================
# Saves a permanent file named 'gpsdata.mv.db' in your operating system user home directory
spring.datasource.url=jdbc:h2:file:~/gpsdata;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# H2 WEB CONSOLE CONFIGURATION
# ===================================================================
# Enables the browser-based UI to view your tables at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allows the console to be loaded inside an HTML frame (crucial for modern browser security)
spring.h2.console.settings.web-allow-others=false

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# Explicitly tells Hibernate to use the H2 SQL syntax dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically updates the H2 database structure to match your Java @Entity classes on startup
spring.jpa.hibernate.ddl-auto=update

# Prints the exact SQL queries Hibernate executes behind the scenes directly into your terminal log
spring.jpa.show-sql=true
# Formats the printed SQL nicely in the console so it's readable
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
# Sets global logging to INFO, but isolates SQL bindings so you can see exactly what coordinates are being saved
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE